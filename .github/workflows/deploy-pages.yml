name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; in-flight runs get cancelled.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      # Project Pages live at jonocodes.github.io/deckd/: the homepage
      # (site/) at the root, the client at /deckd/app/, Ladle at
      # /deckd/ladle/. The same script backs `just pages`, so a local
      # preview is exactly what deploys; it type-checks the client first,
      # so a type error fails the deploy before a broken bundle ships.
      - run: scripts/build_pages.sh _site/deckd

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/deckd

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4