name: Release Linux (AppImage + tarball)

# Phase 2 of #168: build the self-contained deckd AppImage and tarball on a
# Linux runner and attach them to the GitHub release.
#
# The build itself is `just build-linux` (build-linux-appimage +
# build-linux-tarball over one PyInstaller freeze) — the same recipes a
# contributor runs locally (docs/GUIDE.md § "Linux AppImage" / "Linux
# tarball") — so CI and the documented path can't drift. This job only
# supplies the runner, the toolchain, and the publish step.
#
# Two architectures, one matrix: x86_64 on ubuntu-24.04 (arm64 hosted runners
# are free for public repos). aarch64 has no evdev-binary wheel, so the recipe
# source-builds python-evdev before freezing.
#
# The freeze runs inside a manylinux_2_28 container (glibc 2.28) via
# `just build-linux-portable`, not on the runner itself: a PyInstaller bundle
# needs a glibc at least as new as its build host, and the runner's 2.39 would
# lock out Ubuntu 22.04 and Debian 12. `just test-linux-floor` then boots the
# tarball on debian:10 / ubuntu:22.04 / debian:12 / fedora to prove it. Both
# arches must pass before anything is published.
#
# The AppImage is unsigned; users run it directly (`chmod +x`, then execute).
# The root-only uinput step rides along as an install helper bundled inside the
# AppImage at usr/share/deckd/integration/install-system-integration.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the AppImage to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

# Serialise publishes per tag: a second run must not `--clobber` an AppImage
# the first is still uploading. In-flight runs are not cancelled.
concurrency:
  group: release-linux-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: extractions/setup-just@v4

      # `npm run build` already runs `tsc --noEmit`, so a type error fails
      # the release before a broken bundle is frozen in.
      - name: Build client
        run: npm ci && npm run build
        working-directory: client

      # The tag (minus a leading `v`) is the release version, so the AppImage
      # name and the daemon's version agree with the tag.
      - name: Resolve version from the tag
        run: echo "DECKD_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Python, PyInstaller, and the evdev source build all live inside the
      # manylinux container (scripts/build_linux_manylinux.sh); the runner only
      # needs Docker. Icons come from the committed PNGs (`just icons`).
      - name: Build AppImage + tarball (manylinux_2_28)
        run: just build-linux-portable

      # The glibc floor, proven: boot the tarball on old and non-Debian distros.
      - name: Test the distro floor
        run: just test-linux-floor

      # Boot the frozen payload: --help parses args and exits before the
      # server starts, which proves the bundle's interpreter and imports work.
      - name: Smoke-test the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/deckd-*.AppImage --help >/dev/null

      # The install helper extracts its assets with `--appimage-extract`, and
      # falls back to this launcher flag when a binfmt wrapper intercepts the
      # AppImage first. Exercise the fallback so a release can't ship without
      # the assets it needs.
      - name: Smoke-test integration extraction
        run: |
          tmp="$(mktemp -d)"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/deckd-*.AppImage --extract-integration "$tmp"
          test -f "$tmp/70-deckd-uinput.rules"
          test -f "$tmp/deckd.png"
          test -d "$tmp/gnome-shell/deckd-focus@local"
          test -f "$tmp/install-system-integration.sh"

      # A GUI launch opens the browser; with a daemon already up it must just
      # open the browser and exit rather than fail on the busy port. A stub
      # xdg-open records the URL and that the frozen bundle's LD_LIBRARY_PATH
      # didn't leak into the browser's environment.
      - name: Smoke-test GUI launch (open / attach)
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1 DECKD_FAKE_INPUT=1
          stub="$(mktemp -d)"
          printf '#!/bin/sh\necho "$1 ${LD_LIBRARY_PATH:-unset}" >> "%s/opened"\n' "$stub" > "$stub/xdg-open"
          chmod +x "$stub/xdg-open"
          app="$(ls dist/deckd-*.AppImage)"
          "$app" --no-open --no-focus </dev/null >daemon.log 2>&1 &
          daemon=$!
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8765/health >/dev/null && break; sleep 0.5; done
          PATH="$stub:$PATH" timeout 20 "$app" --open </dev/null
          # xdg-open is detached, so give the stub a moment to write.
          for _ in $(seq 20); do [ -s "$stub/opened" ] && break; sleep 0.25; done
          cat "$stub/opened"
          grep -qx 'http://127.0.0.1:8765/ unset' "$stub/opened"
          kill "$daemon"

      # The tarball: the extracted payload boots, finds its own integration
      # assets (bin/../share/deckd/integration), and its top-level helper
      # installs the tree it sits in. The helper runs in its test sandbox
      # (DECKD_HELPER_TEST_ROOT) with systemctl/udevadm stubbed, so this checks
      # the shipped layout, not the runner's systemd.
      - name: Smoke-test the tarball
        run: |
          tmp="$(mktemp -d)"
          tar -C "$tmp" -xzf dist/deckd-*.tar.gz
          tree="$(ls -d "$tmp"/deckd-*/)"
          "$tree/bin/deckd" --help >/dev/null
          "$tree/bin/deckd" --extract-integration "$tmp/ext"
          test -f "$tmp/ext/70-deckd-uinput.rules"
          mkdir "$tmp/stubs" "$tmp/root"
          for cmd in systemctl udevadm gnome-extensions; do
            printf '#!/bin/sh\nexit 0\n' > "$tmp/stubs/$cmd"; chmod +x "$tmp/stubs/$cmd"
          done
          PATH="$tmp/stubs:$PATH" DECKD_HELPER_TEST_ROOT="$tmp/root" \
            bash "$tree/install-system-integration.sh" --user "$(id -un)" --desktop gnome
          test -x "$tmp/root/home/.local/opt/deckd/bin/deckd"
          grep -q -- '--no-open' "$tmp/root/home/.config/systemd/user/deckd.service"

      - uses: actions/upload-artifact@v4
        with:
          name: deckd-linux-${{ matrix.arch }}
          path: |
            dist/deckd-*.AppImage
            dist/deckd-*.tar.gz
            dist/deckd-install-system-integration.sh
          if-no-files-found: error

  # Publish only once every arch has built and passed its floor test, so a
  # release never ships half a matrix.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Both arches carry the same install helper; merging keeps one copy.
      - uses: actions/download-artifact@v4
        with:
          pattern: deckd-linux-*
          path: dist
          merge-multiple: true

      - name: Attach the AppImages and tarballs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A suffixed tag (v1.2.0-rc1) is a prerelease, never "latest". The
          # Linux and macOS workflows race to create the release; the loser
          # just confirms it now exists.
          pre=""; case "$RELEASE_TAG" in *-*) pre="--prerelease" ;; esac
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes $pre \
            || gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            dist/deckd-*.AppImage dist/deckd-*.tar.gz \
            dist/deckd-install-system-integration.sh --clobber
