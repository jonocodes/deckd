name: Release macOS app

# Phase 2 of #165: build the self-contained deckd.app on a macOS runner,
# wrap it in a DMG, and attach it to the GitHub release.
#
# The build itself is `just build-macos-dmg` — the same recipe a contributor
# runs locally (docs/GUIDE.md § "macOS app bundle") — so CI and the documented
# path can't drift. This job only supplies the runner, the toolchain, and the
# publish step.
#
# Between build and publish, `test-app` installs the DMG on a fresh macos-15
# runner and drives the real menu-bar item through Accessibility
# (packaging/macos/test/test-app.sh): menu items, LAN toggle, restart, open
# decks folder / surface, quit, upgrade-in-place, and a screenshot of the
# first-run permission prompt. A release only publishes if that passes.
# Pull requests touching the app run build + test (never publish).
#
# arm64 only: macos-15 runners are Apple Silicon, so the DMG targets Apple
# Silicon Macs. An Intel / universal2 build is a documented follow-up
# (issue #165, "Open questions").
#
# The bundle is ad-hoc signed and NOT notarized (no paid Apple Developer
# Program), so a browser-downloaded DMG is quarantined — first launch needs
# right-click → Open or `xattr -dr com.apple.quarantine /Applications/deckd.app`.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release-macos.yml"
      - "packaging/macos/**"
      - "daemon/deckd/macos_app.py"
      - "daemon/deckd/app_bundle.py"
      - "daemon/deckd/platform_macos.py"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the DMG to (e.g. v0.1.0)"
        required: true
        type: string
      publish:
        description: "Attach the DMG to the release. Off = build + upload as a workflow artifact only (try-it builds)."
        required: false
        type: boolean
        default: true

# Read-only by default; only `publish` can write releases.
permissions:
  contents: read

# Serialise publishes per tag: a second run must not `--clobber` a DMG the
# first is still uploading. In-flight runs are not cancelled (a release
# publish is not safely interruptible).
concurrency:
  group: release-macos-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A pushed tag, the tag supplied to a manual run, or a PR placeholder.
  RELEASE_TAG: ${{ github.event.inputs.tag || (github.event_name == 'pull_request' && format('v0.0.0-pr{0}', github.event.number)) || github.ref_name }}

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: extractions/setup-just@v4

      # PyObjC (the menu-bar wrapper) + PyInstaller. Installing these first
      # also stops the recipe's `uv pip install` fallback from firing.
      - name: Install Python deps
        run: pip install -e ".[macos,packaging]"

      # `npm run build` already runs `tsc --noEmit`, so a type error fails
      # the release before a broken bundle is frozen in.
      - name: Build client
        run: npm ci && npm run build
        working-directory: client

      # The tag (minus a leading `v`) is the release version, so the DMG name,
      # its volume name, and the app's CFBundleShortVersionString all match
      # the tag. Rough CalVer (v2026.09.23) or any other `v*` string works.
      - name: Resolve version from the tag
        run: echo "DECKD_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Build .app + DMG
        run: just build-macos-dmg

      - name: Verify the DMG
        run: hdiutil verify dist/deckd-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: deckd-macos-dmg
          path: dist/deckd-*.dmg
          if-no-files-found: error

  # Install the DMG on a clean runner and click through the real menu. The
  # runner image grants Accessibility / Screen Recording to bash and osascript;
  # --pregrant writes deckd's own TCC grants so its System Events consent
  # prompt doesn't block the run (the script captures that prompt at the end).
  test-app:
    needs: dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deckd-macos-dmg
          path: dmg

      - name: Install + drive the app
        run: packaging/macos/test/test-app.sh --pregrant dmg/deckd-*.dmg test-app-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckd-macos-test-app
          path: test-app-out/

  # Tag pushes always publish; a manual run can opt out to get a tested,
  # downloadable build without creating a release. PRs never publish.
  publish:
    needs: [dmg, test-app]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deckd-macos-dmg
          path: dist

      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/deckd-*.dmg --clobber
