<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="deckd — context-aware controller">
  <title>deckd logo</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="tileGradAlt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="activeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#F43F5E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad)" rx="24"/>

  <!-- Ambient glow behind active tile -->
  <ellipse cx="160" cy="150" rx="110" ry="90" fill="url(#activeGlow)"/>

  <!-- 3x3 grid -->
  <g>
    <!-- top row -->
    <rect x="64"  y="54"  width="56" height="56" rx="11" fill="url(#tileGrad)"/>
    <rect x="132" y="54"  width="56" height="56" rx="11" fill="url(#tileGradAlt)"/>
    <rect x="200" y="54"  width="56" height="56" rx="11" fill="url(#tileGrad)"/>
    <!-- middle row -->
    <rect x="64"  y="122" width="56" height="56" rx="11" fill="url(#tileGrad)"/>
    <!-- ACTIVE center tile -->
    <rect x="132" y="122" width="56" height="56" rx="11" fill="url(#activeGrad)"/>
    <rect x="200" y="122" width="56" height="56" rx="11" fill="url(#tileGradAlt)"/>
    <!-- bottom row -->
    <rect x="64"  y="190" width="56" height="56" rx="11" fill="url(#tileGrad)"/>
    <rect x="132" y="190" width="56" height="56" rx="11" fill="url(#tileGrad)"/>
    <rect x="200" y="190" width="56" height="56" rx="11" fill="url(#tileGrad)"/>
  </g>

  <!-- Wordmark -->
  <text x="320" y="180"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="104" fill="#F8FAFC" letter-spacing="-5">deckd</text>

  <!-- Tagline accent + text -->
  <circle cx="324" cy="212" r="4" fill="#FB923C"/>
  <text x="338" y="217"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="500" font-size="13" fill="#94A3B8" letter-spacing="2.8">CONTEXT-AWARE CONTROLLER</text>
</svg>
