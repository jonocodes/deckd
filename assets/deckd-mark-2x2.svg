<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="deckd mark — 2x2, top-right active">
  <title>deckd mark 2x2 (top-right active)</title>
  <defs>
    <linearGradient id="bg22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="t22" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="t22a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="a22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="g22" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#F43F5E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg22)"/>

  <!-- Glow repositioned behind top-right active tile -->
  <ellipse cx="348" cy="164" rx="220" ry="180" fill="url(#g22)"/>

  <!-- 2x2 grid: 152px tiles, 32px gap, 88px padding -->
  <!-- TL muted | TR ACTIVE -->
  <rect x="88"  y="88"  width="152" height="152" rx="28" fill="url(#t22)"/>
  <rect x="272" y="88"  width="152" height="152" rx="28" fill="url(#a22)"/>
  <!-- BL muted | BR muted -->
  <rect x="88"  y="272" width="152" height="152" rx="28" fill="url(#t22)"/>
  <rect x="272" y="272" width="152" height="152" rx="28" fill="url(#t22)"/>
</svg>
