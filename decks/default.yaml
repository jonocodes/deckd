match:
  - default
display_name: Home
widgets:
  - id: code
    kind: button
    # label: Code
    icon:
      source: lucide
      name: file-code
    color: "#2e328a"
    action:
      shell: code
  - id: firefox
    kind: button
    # label: Firefox
    icon:
      source: simple-icons
      name: firefox
    color: "#b5641d"
    action:
      shell: "firefox"
  - id: obsidian
    kind: button
    # label: Obsidian
    icon:
      source: simple-icons
      name: obsidian
    color: "#6d28c8"
    action:
      shell: "md.obsidian.Obsidian"
  - id: thunderbird
    kind: button
    # label: Thunderbird
    icon:
      source: simple-icons
      name: thunderbird
    color: "#0A84FF"
    action:
      shell: "Thunderbird"

  - id: open-url
    kind: button
    # label: Open github.com
    icon:
      source: simple-icons
      name: github
    color: "black"
    action:
      url: "https://github.com"

  - id: tilix
    kind: button
    # label: Tilix
    icon:
      source: lucide
      name: square-terminal
    color: "#6b0101"
    action:
      # Open the auto-detected terminal ($TERMINAL, then a candidate list).
      # For a specific emulator, use e.g. shell: "tilix" instead.
      terminal: true
  # Send a key combo (issue #16): fires ctrl+t to the focused app.
  - id: send-key-tab
    kind: button
    label: Send Ctrl+T
    icon:
      source: lucide
      name: keyboard
    action:
      key: "ctrl+t"
  # Live system stats (issue #40). A bar-less ``stats`` cell showing
  # several psutil-backed sensor values at once — CPU + memory here — so
  # they work identically on Linux + macOS Intel + Apple Silicon with no
  # per-platform install step. The daemon pushes ``widget_update`` frames
  # at each source's poll cadence (1s). Easy to grow: add another entry to
  # ``metrics`` (each names a daemon-side source; ``label`` is optional and
  # defaults to the source name, e.g. cpu_percent -> CPU). For a single
  # value with a proportional bar instead, use a ``kind: meter`` widget
  # (see README) bound to one ``source``.
  - id: system
    kind: stats
    label: System
    metrics:
      - source: cpu_percent
        label: CPU
      - source: mem_percent
        label: MEM
  # Audio / VLC media control. Commented out — the cell is now home to the
  # live CPU stats above (the audio use case is rare from a phone in practice,
  # and the daemon already sends widget_update frames for it). Re-enable by
  # removing the leading ``#``s; widgets reflow in list order (ADR-0010), so
  # it drops in wherever you place it in the sequence.
  # - id: audio-toggle
  #   kind: button
  #   label: VLC Play/Pause
  #   icon:
  #     source: lucide
  #     name: play
  #   action:
  #     dbus: "org.mpris.MediaPlayer2.vlc:/org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.PlayPause"
  # Macro example (issue #68): chains a shell notification with a
  # keyboard shortcut. Steps run sequentially; an optional delay pauses
  # between them. A failing step stops the macro by default; set
  # ``continue_on_error: true`` to keep going regardless.
  - id: macro-example
    kind: button
    label: Notify + Tab
    icon:
      source: lucide
      name: list-ordered
    size: [2, 1]
    macro:
      steps:
        - type: shell
          value: "notify-send 'deckd macro ran'"
        - type: delay
          value: "500"
        - type: key
          value: "ctrl+t"
  # Confirmation example (issue #69): the daemon withholds this press
  # and asks the client to confirm before running the shell command.
  # The client shows a persistent red border + ⚠ badge on the
  # resting widget, and a centered card modal on press; ``confirm:
  # true`` is the explicit opt-in for dangerous actions — see README.
  - id: confirm-example
    kind: button
    label: Confirm first
    icon:
      source: lucide
      name: alert-triangle
    color: "#7f1d1d"
    confirm: true
    action:
      shell: "notify-send 'deckd: confirmed action ran'"
