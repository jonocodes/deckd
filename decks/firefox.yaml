match:
  - firefox
display_name: Firefox
theme: "#ff7139"
icon:
  source: simple-icons
  name: firefox
# Widgets reflow in list order (ADR-0010): row-major sequence, wrapping to the
# viewport. Navigation on the first row, tab/window/find/url on the second.
widgets:
  - id: back
    kind: button
    # label: Back
    icon:
      source: lucide
      name: arrow-left
    color: "#1e3a8a"
    action:
      key: "alt+Left"
  - id: forward
    kind: button
    # label: Forward
    icon:
      source: lucide
      name: arrow-right
    color: "#1e3a8a"
    action:
      key: "alt+Right"
  - id: reload
    kind: button
    # label: Reload
    icon:
      source: lucide
      name: refresh-cw
    action:
      key: "ctrl+r"
  - id: close-tab
    kind: button
    # label: Close tab
    icon:
      source: lucide
      name: x
    action:
      key: "ctrl+w"
  - id: new-tab
    kind: button
    label: New tab
    icon:
      source: lucide
      name: plus
    action:
      key: "ctrl+t"
  - id: new-window
    kind: button
    label: New window
    icon:
      source: lucide
      name: app-window
    action:
      key: "ctrl+n"
  - id: find
    kind: button
    label: Find
    icon:
      source: lucide
      name: search
    action:
      key: "ctrl+f"
  - id: focus-url
    kind: button
    label: URL bar
    icon:
      source: lucide
      name: link
    action:
      key: "ctrl+l"
