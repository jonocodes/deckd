match:
  - org.gnome.Console
  - foot
  - kitty
  - gnome-terminal
  - konsole
  - alacritty
display_name: Terminal
theme: "#2d333b"
icon:
  source: lucide
  name: terminal
widgets:
  - id: copy
    kind: button
    label: Copy
    icon:
      source: lucide
      name: clipboard
    action:
      key: "ctrl+shift+c"
  - id: paste
    kind: button
    label: Paste
    icon:
      source: lucide
      name: clipboard-paste
    action:
      key: "ctrl+shift+v"
  - id: new-tab
    kind: button
    label: New tab
    icon:
      source: lucide
      name: plus
    action:
      key: "ctrl+shift+t"
  - id: find
    kind: button
    label: Find
    icon:
      source: lucide
      name: search
    action:
      key: "ctrl+shift+f"
