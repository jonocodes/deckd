<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>deckd — editor interaction mockup (#87)</title>
<!-- THROWAWAY PROTOTYPE for issue #87. Two interaction patterns for the layout
     editor, switchable via the bottom bar. No real data, no persistence — clicks
     mutate in-memory state only. Matches grid-reflow.html theme. -->
<style>
  :root {
    --min: 104px; --max: 168px; --gap: 12px;
    --bg: #0e1116; --surface: #161b22; --cell-bg: #21262d; --cell-bg2: #2d333b;
    --accent: #58a6ff; --text: #e6edf3; --muted: #7d8590; --border: #30363d;
    --sel: #f0883e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 32px 96px;
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; max-width: 820px; }
  .sub b { color: var(--accent); }

  /* ---- shared surface / grid (from grid-reflow.html) ---- */
  .surface {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: var(--gap); position: relative;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--min), 1fr));
    grid-auto-rows: minmax(var(--min), 1fr);
    gap: var(--gap); justify-content: center;
  }
  .cell {
    background: linear-gradient(160deg, var(--cell-bg2), var(--cell-bg));
    border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; aspect-ratio: 1/1; max-width: var(--max); max-height: var(--max);
    width: 100%; justify-self: center; user-select: none; cursor: pointer;
    position: relative; transition: border-color .12s, box-shadow .12s;
  }
  .cell:hover { border-color: var(--muted); }
  .cell.selected { border-color: var(--sel); box-shadow: 0 0 0 2px rgba(240,136,62,.35); }
  .cell .icon { font-size: 30px; line-height: 1; }
  .cell .label { font-size: 12px; font-weight: 600; }
  .cell .swatch { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); }
  .cell.add { border-style: dashed; color: var(--muted); background: none; font-size: 28px; }

  /* ---- variant A: full-screen edit chrome ---- */
  .editor { display: grid; grid-template-columns: 220px 1fr 300px; gap: 16px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .palette-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: grab; border: 1px solid transparent; }
  .palette-item:hover { border-color: var(--border); background: var(--cell-bg); }
  .palette-item .ic { font-size: 20px; }
  .canvas-wrap { }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .toolbar .name { font-weight: 600; }
  .toolbar .spacer { flex: 1; }
  button.act { background: var(--cell-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; }
  button.act.primary { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
  button.act:hover { border-color: var(--muted); }

  /* properties form (shared by both variants) */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 7px 9px; font: inherit; }
  .field .row2 { display: flex; gap: 8px; }
  .colors { display: flex; gap: 6px; flex-wrap: wrap; }
  .colors span { width: 24px; height: 24px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .colors span.on { border-color: var(--text); }
  .iconpick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .iconpick span { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .iconpick span.on { border-color: var(--sel); }
  .hint { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 4px; text-align: center; }

  /* ---- variant B: inline inspector popover ---- */
  .stage { position: relative; max-width: 640px; }
  .inspector {
    position: absolute; z-index: 5; width: 260px;
    background: var(--surface); border: 1px solid var(--sel); border-radius: 12px;
    padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .inspector h3 { display: flex; align-items: center; justify-content: space-between; }
  .inspector .close { cursor: pointer; color: var(--muted); font-size: 16px; }
  .device-frame { display: inline-block; }
  .device-frame .dim { color: var(--muted); font-size: 12px; margin: 0 0 8px; }

  /* device rail for B */
  .rail { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; }

  /* bottom variant switcher (from prototype convention) */
  .switcher {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 50;
    display: flex; gap: 6px; background: #010409cc; backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px;
  }
  .switcher a { color: var(--muted); text-decoration: none; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .switcher a.on { background: var(--accent); color: #06101f; }
  .note { max-width: 820px; margin: 18px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; color: var(--muted); }
  .note b { color: var(--text); }
  .statebar { margin-top: 14px; font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <h1>deckd — layout editor interaction (#87)</h1>
  <p class="sub" id="sub"></p>
  <div id="app"></div>
  <div class="statebar" id="statebar"></div>
  <div class="note" id="note"></div>

  <div class="switcher">
    <a data-v="A">A · Full-screen editor</a>
    <a data-v="B">B · Inline inspector</a>
  </div>

<script>
  // ---- in-memory model (no persistence) ----
  const COLORS = ["#2e328a","#b5641d","#6d28c8","#0A84FF","#1f9e57","#c0392b","#8e44ad","#16a085"];
  const ICONS = ["💻","🦊","⌨️","💬","🎵","🐳","📁","✉️","📸","🔊","🎙️","🔒"];
  let widgets = [
    { id:"code",    icon:"💻", label:"Code",    color:"#2e328a" },
    { id:"firefox", icon:"🦊", label:"Firefox", color:"#b5641d" },
    { id:"term",    icon:"⌨️", label:"Terminal",color:"#21262d" },
    { id:"slack",   icon:"💬", label:"Slack",   color:"#6d28c8" },
    { id:"spotify", icon:"🎵", label:"Spotify", color:"#1f9e57" },
    { id:"docker",  icon:"🐳", label:"Docker",  color:"#0A84FF" },
  ];
  let selected = null;   // widget id
  let dirty = false;

  const variant = new URLSearchParams(location.search).get("v") || "A";
  const app = document.getElementById("app");

  const SUBS = {
    A: `<b>Variant A — full-screen editor.</b> Enter a dedicated <b>edit</b> chrome view. Left: widget palette (drag or click to add). Center: the live grid canvas — click a cell to select. Right: a persistent properties panel for the selected widget. Desktop-first: lots of room, everything visible at once.`,
    B: `<b>Variant B — inline inspector.</b> No mode change. Tap-and-hold (or long-press on touch) any button on the normal control surface to pop a small inspector anchored to it — quick per-widget tweak of icon / color / label / action. Optimized for the device itself (phone/tablet), one widget at a time.`,
  };
  const NOTES = {
    A: `<b>Decision this pokes at:</b> is the sidebar+canvas worth building for v1, and is it desktop-only? Add / reorder / delete all live here. Reorder = drag on the canvas (or the up/down affordance — the round-trip in #85 handles either for free).`,
    B: `<b>Decision this pokes at:</b> is a lightweight on-device inspector needed <i>in addition to</i> A, or instead of it? It can't easily express add / delete / reorder — it's an <i>edit-existing</i> surface. Overlaps with the fact that the deck device is often small and touch-only.`,
  };

  function swatchStyle(c){ return `background:${c}`; }

  // ---------- properties form (shared) ----------
  function propsForm(w) {
    if (!w) return `<div class="empty">Select a button to edit its properties.</div>`;
    return `
      <div class="field">
        <label>ID <span class="hint">(unique; used as the round-trip key)</span></label>
        <input type="text" value="${w.id}" data-k="id">
      </div>
      <div class="field">
        <label>Label</label>
        <input type="text" value="${w.label}" data-k="label">
      </div>
      <div class="field">
        <label>Icon</label>
        <div class="iconpick">
          ${ICONS.map(ic=>`<span class="${ic===w.icon?'on':''}" data-icon="${ic}">${ic}</span>`).join("")}
        </div>
      </div>
      <div class="field">
        <label>Color</label>
        <div class="colors">
          ${COLORS.map(c=>`<span class="${c===w.color?'on':''}" style="${swatchStyle(c)}" data-color="${c}"></span>`).join("")}
        </div>
      </div>
      <div class="field">
        <label>Action <span class="hint">(shell)</span></label>
        <input type="text" value="${w.id}" data-k="action">
      </div>`;
  }

  function wireForm(root) {
    const w = widgets.find(x=>x.id===selected);
    if (!w) return;
    root.querySelectorAll("input[data-k]").forEach(inp=>{
      inp.addEventListener("input", e=>{
        const k=e.target.dataset.k;
        if (k==="action") { dirty=true; render(); return; }
        w[k]=e.target.value; dirty=true; render();
      });
    });
    root.querySelectorAll("[data-icon]").forEach(s=>s.addEventListener("click",()=>{ w.icon=s.dataset.icon; dirty=true; render(); }));
    root.querySelectorAll("[data-color]").forEach(s=>s.addEventListener("click",()=>{ w.color=s.dataset.color; dirty=true; render(); }));
  }

  // ---------- grid cell ----------
  function cellHTML(w) {
    const dark = w.color==="#21262d";
    return `<div class="cell ${w.id===selected?'selected':''}" data-id="${w.id}" style="${dark?'':`background:linear-gradient(160deg, ${w.color}dd, ${w.color}99)`}">
      <span class="swatch" style="background:${w.color}"></span>
      <div class="icon">${w.icon}</div><div class="label">${w.label}</div>
    </div>`;
  }

  // ---------- VARIANT A ----------
  function renderA() {
    const w = widgets.find(x=>x.id===selected);
    app.innerHTML = `
      <div class="editor">
        <div class="panel">
          <h3>Palette</h3>
          ${["button","meter","stats"].map(k=>`<div class="palette-item" data-add="${k}"><span class="ic">${k==="button"?"⬛":k==="meter"?"📊":"📈"}</span> ${k}</div>`).join("")}
          <p class="hint" style="margin-top:12px">Click to append a new ${'button'} (auto-id, editable).</p>
        </div>
        <div class="canvas-wrap">
          <div class="toolbar">
            <span class="name">default.yaml</span>
            <span class="hint">· edit mode</span>
            <span class="spacer"></span>
            <button class="act" id="del" ${selected?'':'disabled style=opacity:.4'}>Delete</button>
            <button class="act primary" id="save" ${dirty?'':'disabled style=opacity:.5'}>Save</button>
          </div>
          <div class="surface"><div class="grid" id="grid">
            ${widgets.map(cellHTML).join("")}
            <div class="cell add" data-add="button">＋</div>
          </div></div>
          <p class="hint" style="margin-top:10px">Click a button to select → edit on the right. Drag to reorder (order = grid position, ADR-0010).</p>
        </div>
        <div class="panel">
          <h3>Properties${w?` · ${w.id}`:''}</h3>
          <div id="props">${propsForm(w)}</div>
        </div>
      </div>`;
    app.querySelectorAll(".cell[data-id]").forEach(c=>c.addEventListener("click",()=>{ selected=c.dataset.id; render(); }));
    app.querySelectorAll("[data-add]").forEach(el=>el.addEventListener("click",()=>addWidget()));
    const del=app.querySelector("#del"); if(del) del.addEventListener("click",()=>{ widgets=widgets.filter(x=>x.id!==selected); selected=null; dirty=true; render(); });
    const save=app.querySelector("#save"); if(save) save.addEventListener("click",()=>{ dirty=false; render(); });
    wireForm(app.querySelector("#props"));
  }

  // ---------- VARIANT B ----------
  function renderB() {
    const w = widgets.find(x=>x.id===selected);
    app.innerHTML = `
      <div class="rail">
        <div class="device-frame">
          <p class="dim">Phone · touch · long-press a button</p>
          <div class="stage">
            <div class="surface" style="width:360px">
              <div class="grid" style="--min:80px">${widgets.map(cellHTML).join("")}</div>
            </div>
            ${w?`<div class="inspector" style="left:120px; top:70px">
              <h3>${w.id} <span class="close" id="close">✕</span></h3>
              <div id="props">${propsForm(w)}</div>
              <button class="act primary" id="save" style="width:100%; margin-top:6px" ${dirty?'':'disabled style=opacity:.5'}>Save</button>
            </div>`:''}
          </div>
        </div>
      </div>`;
    app.querySelectorAll(".cell[data-id]").forEach(c=>c.addEventListener("click",()=>{ selected=c.dataset.id; render(); }));
    const close=app.querySelector("#close"); if(close) close.addEventListener("click",()=>{ selected=null; render(); });
    const save=app.querySelector("#save"); if(save) save.addEventListener("click",()=>{ dirty=false; selected=null; render(); });
    wireForm(app.querySelector("#props"));
  }

  let addN = 1;
  function addWidget() {
    const id = `button-${addN++}`;
    widgets.push({ id, icon:"⬛", label:id, color:"#21262d" });
    selected = id; dirty = true; render();
  }

  function render() {
    document.getElementById("sub").innerHTML = SUBS[variant];
    document.getElementById("note").innerHTML = NOTES[variant];
    document.getElementById("statebar").textContent =
      `state · ${widgets.length} widgets · selected=${selected||"—"} · dirty=${dirty}`;
    document.querySelectorAll(".switcher a").forEach(a=>{
      a.classList.toggle("on", a.dataset.v===variant);
      a.href = `?v=${a.dataset.v}`;
    });
    (variant==="B"?renderB:renderA)();
  }
  render();
</script>
</body>
</html>
