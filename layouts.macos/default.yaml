# Mac fallback layout. Used when no per-app layout matches. Same `id` as
# `layouts/default.yaml` so the overlay-replaces-base loader picks this
# one on Mac without touching the shared base.
match:
  - default
display_name: Home
widgets:
  - id: code
    kind: button
    icon:
      source: lucide
      name: file-code
    color: "#2e328a"
    action:
      shell: code
  - id: firefox
    kind: button
    icon:
      source: simple-icons
      name: firefox
    color: "#b5641d"
    action:
      shell: "open -a Firefox"
  - id: obsidian
    kind: button
    icon:
      source: simple-icons
      name: obsidian
    color: "#6d28c8"
    action:
      shell: "open -a Obsidian"
  - id: thunderbird
    kind: button
    icon:
      source: simple-icons
      name: thunderbird
    color: "#0A84FF"
    action:
      shell: "open -a Thunderbird"

  - id: open-url
    kind: button
    icon:
      source: simple-icons
      name: github
    color: "black"
    action:
      shell: "open https://github.com"

  - id: terminal
    kind: button
    icon:
      source: lucide
      name: square-terminal
    color: "#6b0101"
    action:
      # terminal: true
      shell: "open -a iTerm"

  - id: send-key-tab
    kind: button
    label: Send Cmd+T
    icon:
      source: lucide
      name: keyboard
    action:
      key: "super+t"

  - id: system
    kind: stats
    label: System
    metrics:
      - source: cpu_percent
        label: CPU
      - source: mem_percent
        label: MEM
