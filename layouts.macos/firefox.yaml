# Firefox on macOS. Same match token as the Linux firefox.yaml (the Mac
# process is reported as `firefox`), so this file sorts first (the `-` is
# ASCII 0x2D, before `.`) and wins on the Mac. On a Linux checkout delete
# this file or restructure into per-platform layouts dirs.
match:
  - firefox
display_name: Firefox
theme: "#ff7139"
icon:
  source: simple-icons
  name: firefox
# Widgets reflow in list order (ADR-0010): navigation first, then tab/window/
# find/url on the next row.
widgets:
  - id: back
    kind: button
    icon:
      source: lucide
      name: arrow-left
    color: "#1e3a8a"
    action:
      key: "super+["
  - id: forward
    kind: button
    icon:
      source: lucide
      name: arrow-right
    color: "#1e3a8a"
    action:
      key: "super+]"
  - id: reload
    kind: button
    icon:
      source: lucide
      name: refresh-cw
    action:
      key: "super+r"
  - id: close-tab
    kind: button
    icon:
      source: lucide
      name: x
    action:
      key: "super+w"
  - id: new-tab
    kind: button
    label: New tab
    icon:
      source: lucide
      name: plus
    action:
      key: "super+t"
  - id: new-window
    kind: button
    label: New window
    icon:
      source: lucide
      name: app-window
    action:
      key: "super+n"
  - id: find
    kind: button
    label: Find
    icon:
      source: lucide
      name: search
    action:
      key: "super+f"
  - id: focus-url
    kind: button
    label: URL bar
    icon:
      source: lucide
      name: link
    action:
      key: "super+l"
