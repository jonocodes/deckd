match:
  - default
display_name: Home
widgets:
  - id: code
    kind: button
    # label: Code
    icon:
      source: lucide
      name: file-code
    color: "#2e328a"
    grid: [0, 0, 1, 1]
    action:
      shell: code
  - id: firefox
    kind: button
    # label: Firefox
    icon:
      source: simple-icons
      name: firefox
    color: "#b5641d"
    grid: [1, 0, 1, 1]
    action:
      shell: "firefox"
  - id: obsidian
    kind: button
    # label: Obsidian
    icon:
      source: simple-icons
      name: obsidian
    color: "#6d28c8"
    grid: [2, 0, 1, 1]
    action:
      shell: "md.obsidian.Obsidian"
  - id: thunderbird
    kind: button
    # label: Thunderbird
    icon:
      source: simple-icons
      name: thunderbird
    color: "#0A84FF"
    grid: [3, 0, 1, 1]
    action:
      shell: "Thunderbird"

  - id: open-url
    kind: button
    # label: Open github.com
    icon:
      source: simple-icons
      name: github
    color: "black"
    grid: [0, 1, 1, 1]
    action:
      shell: "xdg-open https://github.com"

  - id: tilix
    kind: button
    # label: Tilix
    icon:
      source: lucide
      name: square-terminal
    color: "#6b0101"
    grid: [1, 1, 1, 1]
    action:
      # Open the auto-detected terminal ($TERMINAL, then a candidate list).
      # For a specific emulator, use e.g. shell: "tilix" instead.
      terminal: true
  # Send a key combo (issue #16): fires ctrl+t to the focused app.
  - id: send-key-tab
    kind: button
    label: Send Ctrl+T
    icon:
      source: lucide
      name: keyboard
    grid: [2, 1, 1, 1]
    action:
      key: "ctrl+t"
  # Audio / VLC media control. Commented out — the cell is now home
  # to the live CPU meter (the audio use case is rare from a phone
  # in practice, and the daemon already sends widget_update frames
  # for it). Re-enable by removing the leading ``#``s; the grid slot
  # below is intentionally vacant so adding it back doesn't shift
  # neighbouring widgets.
  # - id: audio-toggle
  #   kind: button
  #   label: VLC Play/Pause
  #   icon:
  #     source: lucide
  #     name: play
  #   grid: [3, 2, 1, 1]
  #   action:
  #     dbus: "org.mpris.MediaPlayer2.vlc:/org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.PlayPause"
  # Macro example (issue #68): chains a shell notification with a
  # keyboard shortcut. Steps run sequentially; an optional delay pauses
  # between them. A failing step stops the macro by default; set
  # ``continue_on_error: true`` to keep going regardless.
  - id: macro-example
    kind: button
    label: Notify + Tab
    icon:
      source: lucide
      name: list-ordered
    grid: [0, 2, 2, 1]
    macro:
      steps:
        - type: shell
          value: "notify-send 'deckd macro ran'"
        - type: delay
          value: "500"
        - type: key
          value: "ctrl+t"
  # Live system stats (issue #40). A bar-less ``stats`` cell showing
  # several psutil-backed sensor values at once — CPU + memory here — so
  # they work identically on Linux + macOS Intel + Apple Silicon with no
  # per-platform install step. The daemon pushes ``widget_update`` frames
  # at each source's poll cadence (1s). Easy to grow: add another entry to
  # ``metrics`` (each names a daemon-side source; ``label`` is optional and
  # defaults to the source name, e.g. cpu_percent -> CPU). For a single
  # value with a proportional bar instead, use a ``kind: meter`` widget
  # (see README) bound to one ``source``.
  - id: system
    kind: stats
    label: System
    grid: [3, 1, 1, 1]
    metrics:
      - source: cpu_percent
        label: CPU
      - source: mem_percent
        label: MEM
