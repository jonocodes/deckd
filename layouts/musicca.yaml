# Web-app layout: a portable on-screen musical keyboard.
#
# This claims Musicca's keyboard instruments by window title. Musicca maps the
# computer keyboard's top letter row to white keys and the number row to black
# keys, and — crucially — every keyboard instrument (piano, synthesizer, ...)
# uses the *same* mapping. So one layout drives all of them, and it will drive
# any other site that adopts the same "letters = white, numbers = black" scheme:
# just add that site's title token to `match:` below.
#
# The buttons are ordinary `key:` actions — no new daemon capability, only
# detection. Known limitation: a tap fires key-down+up momentarily, so notes
# that decay (piano, plucked) sound right, but a sustained synth pad won't hold.
#
# Range: one octave F3-F4, the block verified against the live site. The lower
# octave (z/x/c... rows) can be added once its keys are confirmed the same way.
#
# KNOWN LIMITATION (ADR-0010): this layout wants a piano's 2D alignment — black
# keys sitting *above* the white keys they belong between. The old coordinate
# grid guaranteed that; reflow does not — the column count now follows the
# viewport width, so the two rows only line up when the grid happens to render
# at 8 columns. The keys still all work (they are plain `key:` actions); only
# the visual black/white registration is best-effort. A `blank` holds the
# no-black-key gap between B and C so the F#/G#/A# and C#/D# clusters stay
# grouped in sequence. Faithful piano rendering likely needs a positioned /
# full-surface widget — tracked as follow-on, not solved here.
match:
  - "title:*Musicca*"        # piano, synthesizer, and any Musicca keyboard page
  # - "title:*Virtual Piano*"  # example: extend to another site with the same mapping
display_name: Keyboard
theme: "#7c3aed"
icon:
  source: lucide
  name: piano
jogstrip: false
widgets:
  # --- Black keys (top row) — clustered F#/G#/A#, gap, C#/D# ---
  - id: fs3
    kind: button
    label: "F#"
    color: "#1a1a1a"
    action: { key: "2" }
  - id: gs3
    kind: button
    label: "G#"
    color: "#1a1a1a"
    action: { key: "3" }
  - id: as3
    kind: button
    label: "A#"
    color: "#1a1a1a"
    action: { key: "4" }
  # No black key between B and C — a blank keeps the two clusters grouped.
  - id: gap-b-c
    kind: blank
  - id: cs4
    kind: button
    label: "C#"
    color: "#1a1a1a"
    action: { key: "6" }
  - id: ds4
    kind: button
    label: "D#"
    color: "#1a1a1a"
    action: { key: "7" }
  # --- White keys (bottom row) F3 G3 A3 B3 C4 D4 E4 F4 ---
  - id: f3
    kind: button
    label: "F"
    action: { key: "q" }
  - id: g3
    kind: button
    label: "G"
    action: { key: "w" }
  - id: a3
    kind: button
    label: "A"
    action: { key: "e" }
  - id: b3
    kind: button
    label: "B"
    action: { key: "r" }
  - id: c4
    kind: button
    label: "C"
    action: { key: "t" }
  - id: d4
    kind: button
    label: "D"
    action: { key: "y" }
  - id: e4
    kind: button
    label: "E"
    action: { key: "u" }
  - id: f4
    kind: button
    label: "F"
    action: { key: "i" }
