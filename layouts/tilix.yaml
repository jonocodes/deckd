match:
  - com.gexperts.Tilix
  - Tilix
display_name: Tilix
theme: "#8bc34a"
icon:
  source: lucide
  name: terminal
widgets:
  - id: split-right
    kind: button
    label: Split right
    icon:
      source: lucide
      name: columns-2
    action:
      key: "ctrl+alt+r"
  - id: split-down
    kind: button
    label: Split down
    icon:
      source: lucide
      name: rows-2
    action:
      key: "ctrl+alt+d"
  - id: new-window
    kind: button
    label: New window
    icon:
      source: lucide
      name: app-window
    action:
      key: "ctrl+shift+n"
  - id: next-terminal
    kind: button
    label: Next term
    icon:
      source: lucide
      name: arrow-right
    action:
      key: "ctrl+tab"
  - id: close-terminal
    kind: button
    label: Close term
    icon:
      source: lucide
      name: x
    action:
      key: "ctrl+shift+w"
  - id: find
    kind: button
    label: Find
    icon:
      source: lucide
      name: search
    action:
      key: "ctrl+shift+f"
