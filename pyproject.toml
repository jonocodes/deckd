[project]
name = "deckd"
version = "0.0.1"
description = "App-aware touch control surface daemon"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    # Comment-preserving YAML round-trip for the layout write API (issues
    # #84 / #85 / #99): the editor reconciles a client snapshot onto a
    # fresh on-disk re-read so a hand-authored layout's comments and key
    # order survive a one-field save. PyYAML stays for the load path.
    "ruamel.yaml>=0.18",
    "pydantic>=2.6",
    "dbus-fast>=5",
    "watchfiles>=1.0",
    # psutil backs the daemon's cross-platform sensor sources
    # (CPU utilization, memory used, CPU frequency, battery).
    # One pure-Python dep that works on Linux + macOS Intel + Apple
    # Silicon without per-OS install steps. Wheel-only on every
    # supported platform; no compile toolchain needed.
    "psutil>=5.9",
]

[project.optional-dependencies]
uinput = [
    # x86_64 gets the prebuilt evdev-binary wheel. Other arches (notably
    # aarch64) have no evdev-binary wheel, so fall back to the sdist `evdev`,
    # which builds from source -- needs a C compiler + kernel headers. On a
    # stock distro `pip install .[uinput]` handles that; on Nix/flox use
    # scripts/install_evdev_source.sh (it locates and passes the header paths).
    "evdev-binary>=1.9; platform_machine == 'x86_64'",
    "evdev>=1.9; platform_machine != 'x86_64'",
]
dev = [
    "websockets>=13",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
macos = [
    # Quartz covers input injection and CGWindowList window enumeration;
    # Cocoa + ApplicationServices activate and raise AX windows.
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

[project.scripts]
deckd = "deckd.__main__:main"
deckd-dev = "deckd.dev:main"
deckctl = "deckd.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["daemon"]
include = ["deckd*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
# Point pyright at the project venv so `pyright daemon` resolves
# third-party imports (aiohttp, dbus_fast, pydantic, etc.) regardless
# of how it's invoked — bare `pyright`, `.venv/bin/pyright`, or via
# `just test-all`. Without this, pyright falls back to stdlib-only
# and every import is a false-positive error.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
