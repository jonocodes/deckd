# Stable fixture deck used by the deck-override tests (POST /deck/firefox).
# See fixtures/decks/default.yaml for why these are separate from the
# shipping decks. The override tests assert the ``back`` widget is present.
match:
  - firefox
display_name: Firefox
theme: "#ff7139"
icon:
  source: simple-icons
  name: firefox
widgets:
  - id: back
    kind: button
    label: Back
    action:
      key: "alt+Left"
